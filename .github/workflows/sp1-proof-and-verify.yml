name: SP1 ZK-001 proof and verification

on:
  push:
    paths:
      - ".github/workflows/sp1-proof-and-verify.yml"
      - "fixtures/zk/policy-evaluation-v0.1.0-draft.json"
      - "spikes/zk-statement/sp1-policy-evaluation/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sp1-zk-001-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: spikes/zk-statement/sp1-policy-evaluation
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned SP1 distribution without GitHub API lookup
        run: |
          mkdir -p "$HOME/.sp1/bin" "$HOME/.sp1/toolchains" "$RUNNER_TEMP/aichain-sp1-toolchain"
          curl --fail --location --retry 3 https://github.com/succinctlabs/sp1/releases/download/v6.5.0/cargo_prove_v6.5.0_linux_amd64.tar.gz | tar -xz -C "$HOME/.sp1/bin"
          curl --fail --location --retry 3 https://github.com/succinctlabs/rust/releases/download/succinct-1.94.0-64bit/rust-toolchain-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$RUNNER_TEMP/aichain-sp1-toolchain"
          mv "$RUNNER_TEMP/aichain-sp1-toolchain" "$HOME/.sp1/toolchains/ci"
          rustup toolchain link succinct "$HOME/.sp1/toolchains/ci"
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
      - name: Generate and independently verify a proof
        run: |
          cargo prove --version
          cargo run --release -p aichain-sp1-policy-evaluation-script -- --prove ../../../fixtures/zk/policy-evaluation-v0.1.0-draft.json
