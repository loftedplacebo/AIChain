<!doctype html><meta charset="utf-8"><title>AIChain — closed synthetic batch</title><style>body{max-width:760px;margin:48px auto;font:16px system-ui;color:#17212b}code{overflow-wrap:anywhere}button{padding:11px 16px;border:0;border-radius:7px;background:#134e8a;color:#fff;font-weight:650}button:disabled{background:#82909d}pre{white-space:pre-wrap}</style><h1>Closed synthetic Base batch</h1><p>Two controlled fixtures are ready. MetaMask retains the key and displays the zero-value transaction before signing.</p><p><b>Batch:</b> <code id=batch></code></p><p><b>Receipts:</b> <span id=count></span></p><p><b>Contract:</b> <code id=contract></code></p><button id=connect>1. Connect Fluxora MetaMask</button> <button id=send disabled>2. Review and submit batch</button><pre id=status>Loading…</pre><script>let p,a;const s=x=>document.querySelector('#status').textContent=x;(async()=>{p=await fetch('/build/base-sepolia/first-closed-cycle-prepared.json').then(r=>r.json());batch.textContent=p.queueBatchId;count.textContent=p.receiptIds.length;contract.textContent=p.transaction.to;s('Ready.');})().catch(e=>s(e.message));connect.onclick=async()=>{try{const accounts=await ethereum.request({method:'eth_requestAccounts'});if(await ethereum.request({method:'eth_chainId'})!=='0x14a34')throw Error('Select Base Sepolia.');a=accounts.find(x=>x.toLowerCase()===p.anchor.publisher);if(!a)throw Error('Select Fluxora.');send.disabled=false;s('Connected: '+a)}catch(e){s(e.message)}};send.onclick=async()=>{try{const tx=await ethereum.request({method:'eth_sendTransaction',params:[{from:a,to:p.transaction.to,value:'0x0',data:p.transaction.data}]});s('Submitted: '+tx+'\nSend this transaction hash to Codex.');send.disabled=true}catch(e){s(e.message)}};</script>
