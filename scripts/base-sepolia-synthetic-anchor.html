<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIChain — synthetic anchor</title>
<style>body{max-width:760px;margin:48px auto;padding:0 20px;font:16px/1.5 system-ui;color:#17212b}.card{margin:24px 0;padding:20px;border:1px solid #cad3dc;border-radius:10px;background:#f8fafc}code{overflow-wrap:anywhere}button{padding:11px 16px;border:0;border-radius:7px;background:#134e8a;color:#fff;font-weight:650;cursor:pointer}button:disabled{background:#82909d}#status{white-space:pre-wrap}</style>
<h1>Synthetic Base Sepolia batch anchor</h1><p>This local page sends one non-sensitive, deterministic test commitment. MetaMask keeps the private key and shows the transaction before signing.</p>
<div class=card><p><b>Contract:</b> <code id=contract></code></p><p><b>Synthetic root:</b> <code id=root></code></p><p><b>Publisher-scoped batch ID:</b> <code id=batchId></code></p><button id=connect>1. Connect Fluxora MetaMask</button> <button id=anchor disabled>2. Review and anchor synthetic batch</button></div><div class=card><b>Status</b><div id=status>Loading…</div></div>
<script>const chain='0x14a34';let m,account;const s=x=>document.querySelector('#status').textContent=x;(async()=>{m=await fetch('/build/base-sepolia/synthetic-anchor-manifest.json').then(r=>r.json());for(const id of ['contract','root','batchId'])document.querySelector('#'+id).textContent=m[id==='root'?'batchRoot':id];s('Ready.');})().catch(e=>s(e.message));connect.onclick=async()=>{try{if(!ethereum)throw Error('MetaMask was not detected.');const a=await ethereum.request({method:'eth_requestAccounts'});if(await ethereum.request({method:'eth_chainId'})!==chain)throw Error('Select Base Sepolia in MetaMask.');account=a.find(x=>x.toLowerCase()===m.publisher.toLowerCase());if(!account)throw Error('Select Fluxora in MetaMask.');anchor.disabled=false;s('Connected: '+account)}catch(e){s('Connection not completed: '+e.message)}};anchor.onclick=async()=>{try{s('MetaMask will show the synthetic anchor transaction for review.');const tx=await ethereum.request({method:'eth_sendTransaction',params:[{from:account,to:m.transaction.to,value:'0x0',data:m.transaction.data}]});s('Submitted to Base Sepolia. Transaction hash:\n'+tx+'\n\nSend it to Codex for event and indexer verification.');anchor.disabled=true}catch(e){s('Anchor not completed: '+e.message)}};</script>
