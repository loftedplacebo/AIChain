# Temporary closed hostnames for the isolated production preparation flow.
# Do not add an application proxy until private preflight and owner review pass.
server {
    listen 80;
    listen [::]:80;
    server_name prod.orvessian.com api-prod.orvessian.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name prod.orvessian.com api-prod.orvessian.com;
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/orvessian-production/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orvessian-production/privkey.pem;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;

    location / { return 404; }
}
