# Temporary ACME-only hostnames for the isolated production preparation flow.
# Do not add a 443 proxy until private API/portal preflight and owner review pass.
server {
    listen 80;
    listen [::]:80;
    server_name prod.orvessian.com api-prod.orvessian.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / { return 404; }
}
