# Candidate replacement for the closed holding site. Enable only after the
# WorkOS, database, synthetic journey and recovery gates are reviewed.
limit_req_zone $binary_remote_addr zone=orvessian_pilot_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=orvessian_pilot_auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=orvessian_pilot_connections:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name portal.orvessian.com api.orvessian.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name portal.orvessian.com;
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/orvessian-pilot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orvessian-pilot/privkey.pem;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_redirect off;
    }
}

server {
    listen 443 ssl;
    server_name api.orvessian.com;
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/orvessian-pilot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orvessian-pilot/privkey.pem;
    client_max_body_size 1m;
    client_body_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;

    location = /v1/auth/start {
        limit_req zone=orvessian_pilot_auth burst=3 nodelay;
        limit_conn orvessian_pilot_connections 20;
        proxy_pass http://127.0.0.1:8796;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_redirect off;
    }

    location /v1/ {
        limit_req zone=orvessian_pilot_api burst=30 nodelay;
        limit_conn orvessian_pilot_connections 20;
        proxy_pass http://127.0.0.1:8796;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_redirect off;
    }

    location / { return 404; }
}
