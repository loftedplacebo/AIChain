# Owner-only sign-in acceptance. The API does not expose project or key routes.
# The API still enforces its Production email allowlist and closed project gate.
server {
    listen 80;
    listen [::]:80;
    server_name prod.orvessian.com api-prod.orvessian.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name prod.orvessian.com;
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/orvessian-production/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orvessian-production/privkey.pem;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }
}

server {
    listen 443 ssl;
    server_name api-prod.orvessian.com;
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/orvessian-production/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orvessian-production/privkey.pem;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;

    location = /v1/auth/workos-webhook {
        limit_except POST { deny all; }
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location = /v1/auth/status {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /v1/auth/start {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /v1/auth/callback {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /v1/session {
        limit_except GET DELETE { deny all; }
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /v1/account/sessions {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /v1/account/sessions/revoke {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}
