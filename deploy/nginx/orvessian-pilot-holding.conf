# Temporary HTTP-only routing for certificate issuance. Partner services stay
# closed until the managed database, identity and recovery checks pass.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name portal.orvessian.com api.orvessian.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / { return 404; }
}
