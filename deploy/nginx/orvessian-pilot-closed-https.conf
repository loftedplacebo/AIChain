# Closed HTTPS edge for hostname and certificate checks. Replace only after the
# isolated pilot API/portal, identity policy, backups and restore are accepted.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name portal.orvessian.com api.orvessian.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name portal.orvessian.com api.orvessian.com;
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/orvessian-pilot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orvessian-pilot/privkey.pem;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / { return 404; }
}
